name: CI and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.4)"
        required: false
        default: "0.1.4"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dns

      - name: Format
        working-directory: rust-dns
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust-dns
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust-dns
        run: cargo test --workspace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: LuCI JS syntax
        run: |
          for f in luci-app-rust-dns/htdocs/luci-static/resources/view/rust-dns/*.js; do
            node --check "$f"
          done

      # ucode has no throw statement, and \s inside a character class is a
      # literal "s" (not whitespace). Both mistakes silently broke the rpcd
      # module in 0.1.0, so fail CI on them instead of shipping again.
      - name: ucode static guards
        run: |
          set -eu
          for f in openwrt/rust-dns/files/rust-dns.uc \
                   luci-app-rust-dns/root/usr/share/rpcd/ucode/luci.rust_dns; do
            if grep -nE '(^|[^A-Za-z0-9_])throw([^A-Za-z0-9_]|$)' "$f"; then
              echo "ERROR: ucode has no throw statement; use die()" >&2
              exit 1
            fi
            if grep -nP '\[[^]\n]*\\s[^]\n]*\]' "$f"; then
              echo "ERROR: \\s inside a ucode character class is literal 's'; use [ \\t\\r\\n\\f\\v]" >&2
              exit 1
            fi
            # fs.popen() takes a command string on the ucode shipped by
            # OpenWrt 23.05-25.12; argv-array support only landed upstream in
            # 2026-07 and returns null on routers. Use shquote() instead.
            if grep -nE 'popen\([[:space:]]*\[' "$f"; then
              echo "ERROR: fs.popen() does not accept an argv array on OpenWrt's ucode" >&2
              exit 1
            fi
          done

      - name: Mock API and shell syntax
        run: |
          python3 -m py_compile dev/mock-api/server.py
          for f in openwrt/rust-dns/files/rust-dns.init \
                   openwrt/rust-dns/files/config.sh \
                   openwrt/rust-dns/files/hotplug-iface \
                   openwrt/rust-dns/files/uci-defaults/90-rust-dns \
                   dev/stub/rust-dns; do
            sh -n "$f"
          done

      - name: Service package golden tests
        run: sh openwrt/rust-dns/tests/config_generator/run.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dns

      # armv7 goes through cross (Docker) because ring's musl build is not
      # reliable under cargo-zigbuild on that target.
      - name: Install Zig
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        run: cargo install cargo-zigbuild --locked

      - name: Install cross
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: cargo install cross --locked

      - name: Build static binary (zigbuild)
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        working-directory: rust-dns
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rust-dns 2>&1 | tee build.log

      - name: Build static binary (cross)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        working-directory: rust-dns
        run: cross build --release --locked --target ${{ matrix.target }} -p rust-dns 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: rust-dns/build.log
          if-no-files-found: ignore

      - name: Package
        id: package
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p out
          BIN="rust-dns/target/${{ matrix.target }}/release/rust-dns"
          file "$BIN"
          # OpenWrt unpacks into PKG_BUILD_DIR/.., so the tarball must have a
          # top-level directory named rust-dns-<version>-<arch>.
          STAGE="$(mktemp -d)"
          DIR="rust-dns-${VERSION}-${{ matrix.arch }}"
          mkdir -p "$STAGE/$DIR"
          cp "$BIN" "$STAGE/$DIR/rust-dns"
          tar -czf "out/rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz" -C "$STAGE" "$DIR"
          rm -rf "$STAGE"
          (cd out && sha256sum "rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz" > "rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-dns-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build source bundle and checksums
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          tar -czf "rust-dns-${VERSION}-openwrt-src.tar.gz" \
            openwrt/rust-dns openwrt/geo2txt luci-app-rust-dns \
            docs/RELEASE-NOTES-0.1.1.md docs/RELEASE-NOTES-0.1.2.md docs/RELEASE-NOTES-0.1.3.md docs/RELEASE-NOTES-0.1.4.md README.md README.zh-CN.md LICENSE
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS)
          cat artifacts/SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          generate_release_notes: true
          body: |
            OpenWrt packages are published with a `SHA256SUMS-packages` manifest used by the
            LuCI upgrade backend. The 0.1.1–0.1.4 release notes are in
            `docs/RELEASE-NOTES-*.md` and in the source bundle.
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS
            rust-dns-*-openwrt-src.tar.gz

  openwrt:
    name: OpenWrt ${{ matrix.label }} ${{ matrix.arch }}
    needs: release
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "x86_64-24.10.8", label: "24.10.8", bin_arch: "x86_64" }
          - { arch: "aarch64_generic-24.10.8", label: "24.10.8", bin_arch: "aarch64" }
          - { arch: "aarch64_cortex-a53-24.10.8", label: "24.10.8", bin_arch: "aarch64" }
          - { arch: "arm_cortex-a7_neon-vfpv4-24.10.8", label: "24.10.8", bin_arch: "armv7" }
          - { arch: "x86_64-23.05.5", label: "23.05.5", bin_arch: "x86_64" }
          - { arch: "aarch64_generic-23.05.5", label: "23.05.5", bin_arch: "aarch64" }
          - { arch: "arm_cortex-a7_neon-vfpv4-23.05.5", label: "23.05.5", bin_arch: "armv7" }
          - { arch: "x86_64-25.12.6", label: "25.12.6", bin_arch: "x86_64" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare feed and binary hash
        run: |
          set -eu
          mkdir -p feed sdk-artifacts
          cp -a openwrt/rust-dns feed/rust-dns
          cp -a openwrt/geo2txt feed/geo2txt
          cp -a luci-app-rust-dns feed/luci-app-rust-dns

          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/moliango/rust-dns/releases/download/v${VERSION}/rust-dns-${VERSION}-${{ matrix.bin_arch }}.tar.gz"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/rust-dns.tar.gz "$URL"
          SHA="$(sha256sum /tmp/rust-dns.tar.gz | cut -d' ' -f1)"
          echo "$SHA" > "feed/rust-dns/hashes/${{ matrix.bin_arch }}.sha256"
          echo "binary ${{ matrix.bin_arch }} sha256=$SHA"

      - name: Check SDK image
        run: docker manifest inspect "openwrt/sdk:${{ matrix.arch }}" >/dev/null

      - name: Fetch SDK entrypoint
        run: curl -fsSL "https://raw.githubusercontent.com/openwrt/gh-action-sdk/master/entrypoint.sh" -o entrypoint.sh

      - name: Build OpenWrt packages
        run: |
          set -o pipefail
          # Only the artifact directory must be writable by the SDK user (it
          # moves bin/ and logs/ there at the end).  Never chmod the feed:
          # luci.mk copies root/ and htdocs/ with `cp -pR`, so world-writable
          # feed files end up as 0777 in the package, and rpcd deliberately
          # ignores world-writable ucode scripts.
          chmod -R a+rwX sdk-artifacts
          docker run --rm \
            --entrypoint bash \
            -v "$PWD/feed:/feed" \
            -v "$PWD/sdk-artifacts:/artifacts" \
            -v "$PWD/entrypoint.sh:/entrypoint.sh:ro" \
            -e FEEDNAME=rustdns \
            -e RUST_DNS_ARCH=${{ matrix.bin_arch }} \
            -e PACKAGES="rust-dns luci-app-rust-dns geo2txt" \
            -e NO_REFRESH_CHECK=1 \
            -e NO_SHFMT_CHECK=1 \
            -e BUILD_LOG=1 \
            -e INDEX=1 \
            "openwrt/sdk:${{ matrix.arch }}" \
            /entrypoint.sh 2>&1 | tee "sdk-build-${{ matrix.label }}-${{ matrix.arch }}.log"

      - name: Collect packages
        run: |
          set -eu
          mkdir -p out
          for root in bin sdk-artifacts; do
            [ -d "$root" ] || continue
            find "$root" -type f \( -name '*.ipk' -o -name '*.apk' \) -print |
              while IFS= read -r file; do
                base="$(basename "$file")"
                case "$base" in
                  rust-dns[_-]*|luci-app-rust-dns[_-]*|luci-i18n-rust-dns[_-]*|geo2txt[_-]*)
                    cp "$file" "out/${{ matrix.label }}_${{ matrix.arch }}_${base}"
                    ;;
                esac
              done
          done
          ls -lh out
          if ! find out -type f \( -name '*.ipk' -o -name '*.apk' \) | grep -q .; then
            echo "no OpenWrt packages were collected"
            exit 1
          fi

      # rpcd skips ucode scripts with the world-writable bit set, which would
      # silently disable the whole luci.rust_dns RPC object.  Catch that in CI
      # instead of on a router.
      - name: Check LuCI ucode file modes
        run: |
          set -eu
          found=0
          for pkg in out/*luci-app-rust-dns*.ipk; do
            [ -f "$pkg" ] || continue
            found=1
            tmp="$(mktemp -d)"
            tar -xzf "$pkg" -C "$tmp"
            # -p is essential: without it GNU tar applies the umask while
            # extracting, which strips the world-writable bit and hides
            # exactly the mode this step exists to catch.
            tar -xpzf "$tmp/data.tar.gz" -C "$tmp" ./usr/share/rpcd/ucode/luci.rust_dns
            perm="$(stat -c '%a' "$tmp/usr/share/rpcd/ucode/luci.rust_dns")"
            echo "$pkg: luci.rust_dns mode $perm"
            if [ "$((0$perm & 002))" -ne 0 ]; then
              echo "ERROR: luci.rust_dns is world-writable ($perm); rpcd will ignore it" >&2
              exit 1
            fi
            rm -rf "$tmp"
          done
          if [ "$found" -eq 0 ]; then
            echo "no ipk in this build (apk target); ucode mode check skipped"
          fi

      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.label }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Upload SDK build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-log-${{ matrix.label }}-${{ matrix.arch }}
          path: sdk-build-*.log
          if-no-files-found: ignore

      - name: Attach SDK build log to release on failure
        if: failure() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: sdk-build-*.log

  release-packages:
    name: Attach OpenWrt packages
    needs: openwrt
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: packages
          merge-multiple: true

      - name: Check packages
        id: check
        run: |
          set -eu
          if find packages -type f \( -name '*.ipk' -o -name '*.apk' \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            find packages -type f | sort
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no OpenWrt packages were produced"
          fi

      # The LuCI upgrade backend maps the release asset name to its checksum,
      # so each manifest line must use the exact (basename) asset name.
      - name: Generate package checksums
        if: steps.check.outputs.found == 'true'
        run: |
          set -eu
          (
            cd packages
            find . -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -printf '%f\n' |
              LC_ALL=C sort |
              while IFS= read -r file; do
                sha256sum "$file"
              done > SHA256SUMS-packages
          )
          echo "== packages/SHA256SUMS-packages =="
          cat packages/SHA256SUMS-packages

      - name: Publish OpenWrt packages
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            packages/**/*.ipk
            packages/**/*.apk
            packages/SHA256SUMS-packages
