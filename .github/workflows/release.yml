name: CI and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dns

      - name: Format
        working-directory: rust-dns
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust-dns
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust-dns
        run: cargo test --workspace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: LuCI JS syntax
        run: |
          for f in luci-app-rust-dns/htdocs/luci-static/resources/view/rust-dns/*.js; do
            node --check "$f"
          done

      - name: Mock API and shell syntax
        run: |
          python3 -m py_compile dev/mock-api/server.py
          for f in openwrt/rust-dns/files/rust-dns.init \
                   openwrt/rust-dns/files/config.sh \
                   openwrt/rust-dns/files/hotplug-iface \
                   openwrt/rust-dns/files/uci-defaults/90-rust-dns \
                   dev/stub/rust-dns; do
            sh -n "$f"
          done

      - name: Service package golden tests
        run: sh openwrt/rust-dns/tests/config_generator/run.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dns

      # armv7 goes through cross (Docker) because ring's musl build is not
      # reliable under cargo-zigbuild on that target.
      - name: Install Zig
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        run: cargo install cargo-zigbuild --locked

      - name: Install cross
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: cargo install cross --locked

      - name: Build static binary (zigbuild)
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        working-directory: rust-dns
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rust-dns 2>&1 | tee build.log

      - name: Build static binary (cross)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        working-directory: rust-dns
        run: cross build --release --locked --target ${{ matrix.target }} -p rust-dns 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: rust-dns/build.log
          if-no-files-found: ignore

      - name: Package
        id: package
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p out
          BIN="rust-dns/target/${{ matrix.target }}/release/rust-dns"
          file "$BIN"
          tar -czf "out/rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz" -C "$(dirname "$BIN")" rust-dns
          (cd out && sha256sum "rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz" > "rust-dns-${VERSION}-${{ matrix.arch }}.tar.gz.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-dns-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build source bundle and checksums
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          tar -czf "rust-dns-${VERSION}-openwrt-src.tar.gz" \
            openwrt/rust-dns luci-app-rust-dns README.md README.zh-CN.md LICENSE
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS)
          cat artifacts/SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS
            rust-dns-*-openwrt-src.tar.gz

  openwrt:
    name: OpenWrt ${{ matrix.label }} ${{ matrix.arch }}
    needs: release
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "x86_64-24.10.8", label: "24.10.8", bin_arch: "x86_64" }
          - { arch: "aarch64_generic-24.10.8", label: "24.10.8", bin_arch: "aarch64" }
          - { arch: "aarch64_cortex-a53-24.10.8", label: "24.10.8", bin_arch: "aarch64" }
          - { arch: "arm_cortex-a7_neon-vfpv4-24.10.8", label: "24.10.8", bin_arch: "armv7" }
          - { arch: "x86_64-23.05.5", label: "23.05.5", bin_arch: "x86_64" }
          - { arch: "aarch64_generic-23.05.5", label: "23.05.5", bin_arch: "aarch64" }
          - { arch: "arm_cortex-a7_neon-vfpv4-23.05.5", label: "23.05.5", bin_arch: "armv7" }
          - { arch: "x86_64-25.12.6", label: "25.12.6", bin_arch: "x86_64" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare feed and binary hash
        run: |
          set -eu
          mkdir -p feed sdk-artifacts
          cp -a openwrt/rust-dns feed/rust-dns
          cp -a luci-app-rust-dns feed/luci-app-rust-dns

          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/moliango/rust-dns/releases/download/v${VERSION}/rust-dns-${VERSION}-${{ matrix.bin_arch }}.tar.gz"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/rust-dns.tar.gz "$URL"
          SHA="$(sha256sum /tmp/rust-dns.tar.gz | cut -d' ' -f1)"
          echo "$SHA" > "feed/rust-dns/hashes/${{ matrix.bin_arch }}.sha256"
          echo "binary ${{ matrix.bin_arch }} sha256=$SHA"

      - name: Check SDK image
        run: docker manifest inspect "openwrt/sdk:${{ matrix.arch }}" >/dev/null

      - name: Fetch SDK entrypoint
        run: curl -fsSL "https://raw.githubusercontent.com/openwrt/gh-action-sdk/master/entrypoint.sh" -o entrypoint.sh

      - name: Build OpenWrt packages
        run: |
          set -o pipefail
          # The manual container runs without the action's chown step; make
          # the bind mounts writable by the SDK user so it can move bin/ and
          # logs/ into /artifacts at the end.
          chmod -R a+rwX feed sdk-artifacts
          docker run --rm \
            --entrypoint bash \
            -v "$PWD/feed:/feed" \
            -v "$PWD/sdk-artifacts:/artifacts" \
            -v "$PWD/entrypoint.sh:/entrypoint.sh:ro" \
            -e FEEDNAME=rustdns \
            -e PACKAGES="rust-dns luci-app-rust-dns" \
            -e NO_REFRESH_CHECK=1 \
            -e NO_SHFMT_CHECK=1 \
            -e BUILD_LOG=1 \
            -e INDEX=1 \
            "openwrt/sdk:${{ matrix.arch }}" \
            /entrypoint.sh 2>&1 | tee "sdk-build-${{ matrix.label }}-${{ matrix.arch }}.log"

      - name: Collect packages
        run: |
          set -eu
          mkdir -p out
          find bin sdk-artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) -print -exec sh -c \
            'cp "$1" "out/${{ matrix.label }}_${{ matrix.arch }}_$(basename "$1")"' _ {} \;
          ls -lh out

      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.label }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Upload SDK build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-log-${{ matrix.label }}-${{ matrix.arch }}
          path: sdk-build-*.log
          if-no-files-found: ignore

      - name: Attach SDK build log to release on failure
        if: failure() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: sdk-build-*.log

  release-packages:
    name: Attach OpenWrt packages
    needs: openwrt
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: packages
          merge-multiple: true

      - name: Check packages
        id: check
        run: |
          set -eu
          if find packages -type f \( -name '*.ipk' -o -name '*.apk' \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            find packages -type f | sort
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no OpenWrt packages were produced"
          fi

      - name: Publish OpenWrt packages
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            packages/**/*.ipk
            packages/**/*.apk
