[workspace]
resolver = "2"
members = [
    "crates/rust-dns",
    "crates/rust-dns-core",
    "crates/rust-dns-stats-api",
    "crates/rust-dns-cf-optimizer",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
csv = "1"
hickory-proto = "0.26"
ipnet = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
